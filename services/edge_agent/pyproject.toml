[project]
name = "edge-agent"
version = "0.1.0"
description = "Frigate MQTT -> Colombian plate domain rules -> offline-first outbox -> ingest API"
requires-python = ">=3.11"
dependencies = [
  "paho-mqtt>=2.0",
  "plate-rules",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
edge-agent = "edge_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../packages/plate_rules/src"]

[tool.ruff]
line-length = 96
indent-width = 2
target-version = "py311"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
