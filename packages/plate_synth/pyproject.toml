[project]
name = "plate-synth"
version = "0.1.0"
description = "Synthetic Colombian license plate generation for ALPR evaluation"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "plate-rules",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plate_synth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../plate_rules/src"]

[tool.ruff]
line-length = 96
indent-width = 2
target-version = "py311"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
