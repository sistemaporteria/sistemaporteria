name: porteria-edge

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: porteria-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  # Loops the demo video as an RTSP stream, standing in for the real cameras.
  # Remove this service once physical cameras exist and point Frigate at their RTSP URLs.
  rtsp-sim:
    image: bluenviron/mediamtx:latest
    container_name: porteria-rtsp-sim
    restart: unless-stopped
    environment:
      MTX_PROTOCOLS: tcp
      MTX_PATHS_ENTRADA_RUNONINIT: >-
        ffmpeg -re -stream_loop -1 -i /media/entrada.mp4 -an -c:v libx264 -preset ultrafast
        -tune zerolatency -g 30 -f rtsp rtsp://localhost:8554/entrada
      MTX_PATHS_ENTRADA_RUNONINITRESTART: "yes"
      MTX_PATHS_SALIDA_RUNONINIT: >-
        ffmpeg -re -stream_loop -1 -i /media/salida.mp4 -an -c:v libx264 -preset ultrafast
        -tune zerolatency -g 30 -f rtsp rtsp://localhost:8554/salida
      MTX_PATHS_SALIDA_RUNONINITRESTART: "yes"
    ports:
      - "8554:8554"
    volumes:
      - ./media:/media:ro

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: porteria-frigate
    restart: unless-stopped
    shm_size: "256mb"
    depends_on:
      - mosquitto
      - rtsp-sim
    ports:
      - "8971:8971"  # web UI (authenticated)
      - "5000:5000"  # internal API, unauthenticated: keep bound to localhost in production
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./frigate/config.yml:/config/config.yml
      - ./frigate/storage:/media/frigate
      - ./media:/media/samples:ro
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    environment:
      FRIGATE_MQTT_HOST: mosquitto

volumes:
  mosquitto-data:
  mosquitto-log:
